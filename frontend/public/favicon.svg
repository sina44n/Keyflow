<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="kf-bg" x1="25%" y1="10%" x2="75%" y2="90%">
      <stop offset="0%" stop-color="#1b58ab" />
      <stop offset="100%" stop-color="#124388" />
    </linearGradient>

    <!-- Keycap Bevel Shading Gradients -->
    <linearGradient id="kf-bevel-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ecf7" />
      <stop offset="100%" stop-color="#c5d7ea" />
    </linearGradient>
    <linearGradient id="kf-bevel-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8daec" />
      <stop offset="100%" stop-color="#afc4dd" />
    </linearGradient>

    <!-- Keycap Top Face Gradient -->
    <linearGradient id="kf-top-face" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f5fa" />
    </linearGradient>

    <!-- Keycap Drop Shadow Filter -->
    <filter id="kf-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#0a1d3f" flood-opacity="0.45" />
    </filter>

    <!-- Mascot Gradient -->
    <linearGradient id="kf-mascot-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9000" />
      <stop offset="100%" stop-color="#e65c00" />
    </linearGradient>
  </defs>

  <!-- Blue Background Circle -->
  <circle cx="256" cy="256" r="204" fill="url(#kf-bg)" />

  <!-- Flowing Speed Streaks / Motion Lines -->
  <!-- Row 1: Deep Cyan -->
  <rect x="110" y="171" width="24" height="18" rx="9" fill="#1889d9" />
  <rect x="144" y="171" width="50" height="18" rx="9" fill="#1988d8" />

  <!-- Row 2: Electric Cyan / Turquoise -->
  <rect x="84" y="210" width="102" height="20" rx="10" fill="#00d8f6" />

  <!-- Row 3: Hot Pink / Magenta (protrudes through the circle edge to the left) -->
  <rect x="41" y="246" width="71" height="21" rx="10.5" fill="#fe3b88" />
  <rect x="124" y="246" width="62" height="21" rx="10.5" fill="#fe3b88" />

  <!-- Row 4: Bright Amber / Orange -->
  <rect x="84" y="283" width="55" height="20" rx="10" fill="#fc9d10" />
  <rect x="149" y="283" width="51" height="20" rx="10" fill="#fc9d10" />

  <!-- Row 5: Warm Sunny Yellow -->
  <rect x="144" y="321" width="65" height="19" rx="9.5" fill="#ffc738" />

  <!-- 3D Keycap Group with Soft Shadow -->
  <g filter="url(#kf-shadow)">
    <!-- Keycap Outer Navy Boundary Contour -->
    <path
      d="M 222 152
         C 228 142, 348 126, 358 130
         C 370 134, 408 274, 412 284
         C 416 294, 396 338, 388 346
         C 380 354, 304 374, 296 374
         C 288 374, 204 360, 196 350
         C 188 340, 168 214, 172 204
         C 176 194, 214 160, 222 152 Z"
      fill="#132c58"
    />

    <!-- Keycap Left Bevel (Extruded Side Wall) -->
    <path
      d="M 174 204
         C 184 168, 222 154, 228 152
         L 248 300
         L 204 352
         C 192 344, 170 216, 174 204 Z"
      fill="url(#kf-bevel-left)"
    />

    <!-- Keycap Bottom Bevel (Extruded Lower Wall) -->
    <path
      d="M 204 352
         L 248 300
         C 256 304, 394 286, 404 280
         L 388 346
         C 380 354, 304 374, 296 374
         C 288 374, 212 360, 204 352 Z"
      fill="url(#kf-bevel-bottom)"
    />

    <!-- Keycap Top Face (Tilted Smooth White Surface) -->
    <path
      d="M 230 156
         C 238 146, 346 132, 356 136
         C 366 140, 406 270, 402 278
         C 398 286, 258 304, 248 298
         C 238 290, 220 166, 230 156 Z"
      fill="url(#kf-top-face)"
      stroke="#132c58"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Lightning Bolt Icon on Keycap Face -->
    <polygon
      points="293,174 319,170 314,205 341,209 305,276 308,234 284,226"
      fill="#14346f"
    />
  </g>

  <!-- Mascot Chick Accent at Bottom Right -->
  <g>
    <!-- Mascot Silhouette/Body -->
    <path
      d="M 336 405
         C 342 384, 362 370, 384 368
         C 394 367, 406 358, 412 363
         C 418 368, 408 375, 410 382
         C 414 394, 408 408, 396 416
         C 382 426, 354 426, 342 418
         C 336 414, 331 410, 336 405 Z"
      fill="url(#kf-mascot-grad)"
      stroke="#c24400"
      stroke-width="2.5"
      stroke-linejoin="round"
    />
    <!-- Mascot Wing Feathers -->
    <path
      d="M 342 414
         C 348 396, 364 388, 376 388
         C 368 402, 358 412, 342 414 Z"
      fill="#ffab2e"
    />
    <!-- Mascot Eye -->
    <circle cx="390" cy="369" r="4.5" fill="#152b52" />
    <circle cx="391.5" cy="367.5" r="1.5" fill="#ffffff" />
  </g>
</svg>