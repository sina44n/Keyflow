<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark-theme">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KEYFLOW — Build typing speed, accuracy, and confidence. Less looking. More flowing." />
    <meta name="theme-color" content="#10120F" />
    <title>KEYFLOW — Less looking. More flowing.</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/site.webmanifest?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600;1,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      Theme flash prevention script — runs synchronously before any render.
      Reads localStorage and applies data-theme to <html> immediately,
      preventing a flash of the wrong/default theme on page load.
    -->
    <script>
      (function() {
        var validThemes = [
          'dark-theme','dark-charcoal-lime','classic-black-white','burgundy-cream',
          'midnight-blue','lavender-purple','forest-green','ocean-teal',
          'sunset-orange','rose-pink','arctic-blue','solarized-light',
          'warm-sand','glacier-aqua','forest-sage','midnight-slate'
        ];
        var theme = null;
        try {
          var userId = localStorage.getItem('keyflow_current_user_id');
          var userKey = userId ? 'keyflow_theme_u_' + userId : null;
          theme = (userKey && localStorage.getItem(userKey)) || localStorage.getItem('keyflow-theme');
          if (theme === 'espresso-latte') theme = 'glacier-aqua';
        } catch (e) {}

        if (theme && validThemes.indexOf(theme) !== -1) {
          document.documentElement.setAttribute('data-theme', theme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
